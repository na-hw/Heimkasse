[package]
name = "heimkasse"
version = "0.1.0"
description = "Heimkasse – personal home & living expense manager"
authors = ["Heimkasse"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "heimkasse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# Same sqlx as tauri-plugin-sql; used by the atomic `db_batch` command.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# Keeps the auto-backup folder (picked in the dialog) in the fs scope across restarts.
tauri-plugin-persisted-scope = "2"
tauri-plugin-notification = "2"
